name: Dashboard
# Publishes the online dashboard (GitHub Pages) from the channel state: after every video/post job, at each
# step of a video being made (the make job triggers it), and every 30 minutes for comment changes.
on:
  workflow_run:
    workflows: ["Make videos", "Post scheduled videos"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      PYTHONIOENCODING: utf-8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/setup-python.sh
      - run: python -m pip install -q google-api-python-client google-auth-oauthlib requests pillow
      # read the Claude subscription usage right now, so the dashboard's usage bars are live (not from the last job)
      - name: Fresh Claude usage
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: cd channel && python -c "import manager; manager.claude_usage()" || true
      - run: python channel/site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
