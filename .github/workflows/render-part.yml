name: Render part
run-name: "Render part ${{ inputs.part }}/${{ inputs.parts }} (${{ inputs.job }})"
# One slice of a video's frames, dispatched by app/scripts/cloud-render.ts (the "Make videos" job waits for all of
# them and joins them). The scene comes from, and the finished slice goes back to, the "renders" release.
on:
  workflow_dispatch:
    inputs:
      job:
        required: true
        type: string
      part:
        required: true
        type: string
      parts:
        required: true
        type: string

concurrency:
  group: render-${{ inputs.job }}-${{ inputs.part }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji > /dev/null
      - run: cd app && bun install
      - name: Scene
        run: |
          gh release download renders -p "job-${{ inputs.job }}.tgz" -O job.tgz
          tar -xzf job.tgz -C app
      - name: Render
        run: cd app && bun scripts/render.ts video --video auto --samples 1 --crf 16 --lite --part ${{ inputs.part }}/${{ inputs.parts }} --out ../part.mp4
      - name: Hand back
        run: |
          f="job-${{ inputs.job }}-part-${{ inputs.part }}.mp4"
          cp part.mp4 "$f"
          gh release upload renders "$f" --clobber
