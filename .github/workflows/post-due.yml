name: Post scheduled videos
# Every 10 minutes: publishes videos whose time has come (YouTube public + Instagram Reel + Facebook Reel, with covers).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Post the next scheduled video right now"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Kolkata
      PYTHONIOENCODING: utf-8
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      META_CONFIG_JSON: ${{ secrets.META_CONFIG_JSON }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything due?
        id: due
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          now = datetime.datetime.now().isoformat(timespec="minutes")
          ups = json.load(open("channel/uploads.json", encoding="utf-8"))
          due = any(u.get("status") == "approved" and u.get("postAt", "9") <= now for u in ups)
          # also wake up to retry a platform that missed a recent video (see manager.cmd_post_due)
          cutoff = (datetime.datetime.now() - datetime.timedelta(days=2)).isoformat(timespec="minutes")
          due = due or any(u.get("status") == "published" and u.get("postedAt", "") >= cutoff and u.get("retryAfter", "") <= now
                           and not all(k in u.get("published", {}) for k in ("youtube", "instagram", "facebook")) for u in ups)
          print(f"due={'yes' if due or '${{ inputs.now }}' == 'true' else 'no'}")
          PY
      - if: steps.due.outputs.due == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/setup-python.sh
      - if: steps.due.outputs.due == 'yes'
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          bash .github/scripts/setup-python.sh
          bash .github/scripts/secrets.sh
      - if: steps.due.outputs.due == 'yes'
        run: python -u channel/manager.py ${{ inputs.now == true && 'post-now' || 'post-due' }}
      - if: always() && steps.due.outputs.due == 'yes'
        run: bash .github/scripts/save-state.sh "post"
