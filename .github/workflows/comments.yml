name: Reply to comments
# Every 5 minutes (GitHub's shortest schedule; runs can start a few minutes late): new YouTube, Instagram and
# Facebook comments get an answer. Money/deal/complaint comments are flagged instead (channel/manager.json).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: comments
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Kolkata
      PYTHONIOENCODING: utf-8
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      META_CONFIG_JSON: ${{ secrets.META_CONFIG_JSON }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/setup-python.sh
      - run: bash .github/scripts/setup-python.sh
      - run: bash .github/scripts/secrets.sh
      - run: python -u channel/manager.py comments
      - if: always()
        run: bash .github/scripts/save-state.sh "comments"
