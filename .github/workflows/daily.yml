name: Make videos
# Twice a day (08:30 and 15:00 IST; the second run only tops up if the first fell short): analyse the channel,
# then make Hindi/English videos in the winning pattern, upload them privately and schedule them.
# "Run workflow" lets you make one now, optionally on your own topic.
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (empty = pick the next viral one)"
        type: string
        default: ""
      analyze_only:
        description: "Only analyse the channel (no video)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Kolkata
      PYTHONIOENCODING: utf-8
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
      META_CONFIG_JSON: ${{ secrets.META_CONFIG_JSON }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/setup-python.sh
      - uses: oven-sh/setup-bun@v2
      - name: System tools (ffmpeg, Hindi fonts for the renderer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji > /dev/null
      - run: bash .github/scripts/setup-python.sh
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: analysis/models
          key: kokoro-v1.0
      - name: Voice model
        run: |
          mkdir -p analysis/models && cd analysis/models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f kokoro-v1.0.onnx ] || curl -sSL -o kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin $base/voices-v1.0.bin
          ls -la
      - name: uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-kokoro
      - run: cd app && bun install
      - run: bash .github/scripts/secrets.sh
      - name: Make
        run: |
          mkdir -p out
          if [ "${{ inputs.analyze_only }}" = "true" ]; then
            python -u channel/manager.py analyze
          elif [ -n "${{ inputs.topic }}" ]; then
            python -u channel/manager.py make "${{ inputs.topic }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u channel/manager.py make
          else
            python -u channel/manager.py daily
          fi
      - if: always()
        run: bash .github/scripts/save-state.sh "make"
