<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion as Code</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0908; color: #efe6d6; overflow: hidden;
      font: 12px/1.4 'IBM Plex Mono', ui-monospace, monospace; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; }
    canvas { width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; display: block; }
    #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,.75)); }
    #hud.hidden { display: none; }
    #row { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; opacity: .85; }
    #row .plate { color: #ff5a1f; }
    #row .keys { margin-left: auto; opacity: .5; }
    #bar { position: relative; height: 18px; cursor: pointer; }
    #bar .seg { position: absolute; top: 7px; height: 4px; background: rgba(239,230,214,.18);
      border-right: 2px solid #0b0908; box-sizing: border-box; }
    #bar .seg.on { background: rgba(255,90,31,.45); }
    #bar .head { position: absolute; top: 2px; width: 2px; height: 14px; background: #ff5a1f; }
    body.render #hud { display: none; }
    body.render canvas { width: 100vw; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="hud">
    <div id="row"><span class="time"></span><span class="plate"></span><span class="state"></span>
      <span class="keys">space play · ←/→ seek · ,/. frame · [/] plate · l loop · h hide</span></div>
    <div id="bar"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
